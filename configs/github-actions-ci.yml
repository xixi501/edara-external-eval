name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-paper-pipeline:
    name: Middleware Unit Tests & Paper Pipeline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check repository hygiene (zero secrets or private server paths)
        run: |
          ! grep -rnE "sk-[A-Za-z0-9]{20,}|/workspace/edara" src/ pilots/ configs/ docs/ tests/ README.md ARCHITECTURE.md

      - name: Run full offline unit test suite
        run: |
          pytest -q

      - name: Smoke-test standalone CLI & paper artifact generator
        run: |
          python -m edara_mvp_eval.cli --help >/dev/null
          python pilots/generate_paper_artifacts.py --results-dir results --out-dir /tmp/edara_paper_ci_check
          test -f /tmp/edara_paper_ci_check/table1_main_multihost.tex
          test -f /tmp/edara_paper_ci_check/fig1_host_winrates.svg
          test -f /tmp/edara_paper_ci_check/PAPER_SUMMARY_REPORT.md
