[project]
name = "edara-mvp-eval"
version = "0.1.0"
description = "15-task MVP evaluation harness and Trustworthy-Novelty middleware prototype"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "openai>=1.30",
  "pypdf>=5.0",
  "rank-bm25>=0.2.2",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
benchmarks = [
  "alphaideabench",
]

[project.scripts]
edara-mvp = "edara_mvp_eval.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
