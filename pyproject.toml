[project]
name = "edara-mvp-eval"
version = "0.2.0"
description = "Host-agnostic Trustworthy & Compositional Novelty Middleware and Benchmark-50 Unified Evaluation Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "openai>=1.30",
  "pypdf>=5.0",
  "rank-bm25>=0.2.2",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
benchmarks = [
  "alphaideabench",
]

[project.scripts]
edara-mvp = "edara_mvp_eval.cli:app"
edara-paper-report = "edara_mvp_eval.paper_artifacts:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
